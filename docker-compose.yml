# Kafka + Spark Streaming : météo en temps réel
#   docker compose up -d --build      1re fois : construction de l'image (~5 min)
#   docker compose down               tout arrêter
#
#   JupyterLab      http://localhost:8888   (sans token)
#   Spark UI        http://localhost:4040   (job lancé depuis le notebook ; 4041, 4042 pour les suivants)
#   Master Spark    http://localhost:8080
#   HDFS            http://localhost:9870
#   Kafka           kafka:9092 depuis les conteneurs, localhost:9094 depuis le PC

x-spark: &spark
  image: kafka-meteo/pyspark:latest
  build: ./docker
  pull_policy: build
  volumes:
    - ./work:/home/jovyan/work            # même chemin partout : scripts et checkpoints

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: always
    ports:
      - 9870:9870
      - 9000:9000
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./myhadoop:/myhadoop
    environment:
      - CLUSTER_NAME=test
    env_file:
      - ./hadoop.env

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    hostname: datanode                       # WebHDFS redirige les écritures vers ce nom
    ports:
      - 9864:9864                            # téléchargement des fichiers depuis l'interface HDFS
    restart: always
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file:
      - ./hadoop.env

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    restart: always
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864"
    env_file:
      - ./hadoop.env

  nodemanager1:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager
    restart: always
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088"
    env_file:
      - ./hadoop.env

  historyserver:
    image: bde2020/hadoop-historyserver:2.0.0-hadoop3.2.1-java8
    container_name: historyserver
    restart: always
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088"
    volumes:
      - hadoop_historyserver:/hadoop/yarn/timeline
    env_file:
      - ./hadoop.env

  spark-master:
    <<: *spark
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    command: ["/usr/local/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]

  spark-worker:
    <<: *spark
    container_name: spark-worker
    hostname: spark-worker
    depends_on:
      - spark-master
    command: ["/usr/local/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077", "--cores", "2", "--memory", "4G", "--work-dir", "/tmp/spark-work"]

  pyspark-notebook:
    <<: *spark
    container_name: pyspark_notebook
    hostname: pyspark-notebook
    depends_on:
      - spark-master
      - kafka
    ports:
      - "8888:8888"
      - "4040-4042:4040-4042"
    command: ["start-notebook.sh", "--IdentityProvider.token="]

  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_BYTES: 1073741824

volumes:
  hadoop_namenode:
  hadoop_datanode:
  hadoop_historyserver:
